services:
  - type: web
    name: quryltai-science-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m compileall -q app.py documents.py registry_export.py review_workflow.py meeting_export.py site_import.py group_tasks.py expert_profiles.py
    startCommand: python app.py
    healthCheckPath: /health
    disk:
      name: science-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_IDS
        sync: false
      - key: DB_PATH
        value: /var/data/bot.sqlite3
